<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Beach Kiosk</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CB Kiosk">
<meta name="theme-color" content="#12313d">
<style>
  body { font-family: -apple-system, sans-serif; max-width: 420px; margin: 40px auto; padding: 20px; color: #1d2a33; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .now { font-size: 14px; color: #56656e; margin-bottom: 24px; min-height: 1.4em; }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
  input { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background: #fff; }
  button { width: 100%; padding: 14px; font-size: 16px; background: #0969da; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 12px; }
  button:disabled { background: #ccc; }
  #clearBtn { background: #6e7781; }
  #wakeBtn { background: #1a7f37; }
  #status { margin-top: 16px; font-size: 14px; }
  .success { color: #1a7f37; }
  .error { color: #cf222e; }
  #tokenSection { border-top: 1px solid #eee; margin-top: 30px; padding-top: 20px; }
  #tokenSection summary { cursor: pointer; font-size: 13px; color: #666; }
  .links { margin-top: 24px; font-size: 14px; }
  .links a { color: #0969da; }
</style>
</head>
<body>

<h1>Crystal Beach Kiosk — Guest Name</h1>
<div class="now" id="now">Loading what the TV shows now…</div>

<label for="checkoutDate">Checkout Date</label>
<input type="date" id="checkoutDate">

<label for="guestName">Guest Name</label>
<input type="text" id="guestName" placeholder="e.g. Sarah" autocomplete="off">

<button id="updateBtn">Update Guest Name</button>
<button id="clearBtn">Clear Guest Name</button>
<button id="wakeBtn">Wake TV Now</button>

<div id="status"></div>

<div class="links"><a href="./" target="_blank" rel="noopener">See the welcome screen</a></div>

<details id="tokenSection">
  <summary>GitHub Access Token (one-time setup)</summary>
  <br>
  <label for="tokenInput">Token</label>
  <input type="password" id="tokenInput" placeholder="github_pat_..." autocomplete="off">
  <button id="saveTokenBtn">Save Token</button>
  <button id="forgetTokenBtn" style="background:#6e7781">Remove Token From This Phone</button>
</details>

<script>
const REPO = 'bluepearlretreat/crystal-beach-kiosk';
const FILE_PATH = 'guest-config.json';
const API = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
const TOKEN_KEY = 'cb_kiosk_gh_token';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = (msg, cls = '') => { statusEl.textContent = msg; statusEl.className = cls; };
const getToken = () => localStorage.getItem(TOKEN_KEY);

// UTF-8 safe base64, so names like "José" or "Zoë" survive the round trip.
const toB64 = s => { const b = new TextEncoder().encode(s); let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };
const fromB64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));

function showNow(cfg) {
  const name = (cfg.guestName || '').trim();
  const out = cfg.checkoutDate || '';
  const expired = out && new Date() > new Date(out + 'T23:59:59');
  $('now').textContent = !name ? 'TV shows: no guest name.'
    : expired ? `Last guest: ${name} (checked out ${out}, no longer shown).`
    : `TV shows: "Hello, ${name}."` + (out ? ` until ${out}.` : '');
}

// Current values, read from the public site (no token needed).
fetch(FILE_PATH + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(cfg => {
  showNow(cfg);
  if (cfg.guestName) $('guestName').value = cfg.guestName;
  if (cfg.checkoutDate) $('checkoutDate').value = cfg.checkoutDate;
}).catch(() => { $('now').textContent = ''; });

async function writeConfig(change, message) {
  const token = getToken();
  if (!token) { say('Please set your GitHub token first (below).', 'error'); $('tokenSection').open = true; return false; }
  const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' };
  const getRes = await fetch(API + '?t=' + Date.now(), { headers, cache: 'no-store' });
  if (!getRes.ok) throw new Error(getRes.status === 401 ? 'GitHub rejected the token. Check or replace it below.' : 'Could not read the current settings (' + getRes.status + ').');
  const data = await getRes.json();
  const current = JSON.parse(fromB64(data.content));
  const next = Object.assign({}, current, change);
  const putRes = await fetch(API, {
    method: 'PUT',
    headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
    body: JSON.stringify({ message, content: toB64(JSON.stringify(next, null, 2) + '\n'), sha: data.sha })
  });
  if (!putRes.ok) { const err = await putRes.json().catch(() => ({})); throw new Error(err.message || 'Update failed.'); }
  showNow(next);
  return true;
}

async function run(btn, busyMsg, fn) {
  btn.disabled = true; say(busyMsg);
  try { await fn(); } catch (e) { say('Error: ' + e.message, 'error'); }
  btn.disabled = false;
}

$('updateBtn').addEventListener('click', () => run($('updateBtn'), 'Updating…', async () => {
  const name = $('guestName').value.trim();
  const checkoutDate = $('checkoutDate').value;
  if (name && !checkoutDate) { say('Please pick the checkout date too, so the name is removed after the stay.', 'error'); return; }
  if (await writeConfig({ guestName: name, checkoutDate }, `Update guest name to ${name || '(cleared)'}`))
    say(name ? 'Saved! The TV will show it within about 3 minutes.' : 'Saved.', 'success');
}));

$('clearBtn').addEventListener('click', () => run($('clearBtn'), 'Clearing…', async () => {
  if (await writeConfig({ guestName: '', checkoutDate: '' }, 'Clear guest name')) {
    $('guestName').value = ''; $('checkoutDate').value = '';
    say('Cleared. The TV will stop showing the name within about 3 minutes.', 'success');
  }
}));

// The Pi checks the public guest-config.json every minute and wakes the TV
// when wakeRequest changes. It never needs a token of its own.
$('wakeBtn').addEventListener('click', () => run($('wakeBtn'), 'Sending wake request…', async () => {
  if (await writeConfig({ wakeRequest: new Date().toISOString() }, 'Wake TV requested'))
    say('Wake request sent! The TV should turn on within about 2 minutes.', 'success');
}));

$('saveTokenBtn').addEventListener('click', () => {
  const token = $('tokenInput').value.trim();
  if (token) { localStorage.setItem(TOKEN_KEY, token); $('tokenInput').value = ''; say('Token saved on this phone.', 'success'); }
});
$('forgetTokenBtn').addEventListener('click', () => { localStorage.removeItem(TOKEN_KEY); say('Token removed from this phone.', 'success'); });
</script>

</body>
</html>
